name: Tests

on:
  pull_request:
  # direct pushes to main are allowed, so they get the same checks
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # pinned: ubuntu-latest moved to 26.04, which playwright 1.58 cannot
    # install chromium on. return to ubuntu-latest once playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture gate tests
        run: python3 .agent/architecture_gate_test.py

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npx vitest run src

      - name: Build
        run: npm run build

      - name: Public surface scan
        run: node .hermes/verifiers/public-surface-scan.mjs

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Desktop + mobile projects share the chromium binary, so both run cheaply.
      - name: E2E tests
        run: npx playwright test --project=chromium --project=mobile-chrome

      - name: Mobile homepage verifier
        run: node .hermes/verifiers/mobile-homepage.mjs

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
